name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Never run two releases of the same tag at once, and never cancel one midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release # holds GH_PAT; deployable from v* tags only
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # keyless cosign signing of checksums.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Fail before anything is published if the tap token cannot push.
      - name: Check the Homebrew tap token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The GH_PAT secret is empty. Create a fine-grained PAT with Contents: read and write on yoanbernabeu/homebrew-tap and store it as GH_PAT."
            exit 1
          fi
          if ! gh api repos/yoanbernabeu/homebrew-tap --jq '.permissions.push' | grep -q true; then
            echo "::error::GH_PAT cannot push to yoanbernabeu/homebrew-tap."
            exit 1
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.GH_PAT }}

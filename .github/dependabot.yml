version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "Bump"
    groups:
      go-modules:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "Bump"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: "Bump"
    groups:
      site:
        patterns:
          - "*"
    ignore:
      # @astrojs/check 0.9.10 only accepts typescript ^5 || ^6.
      # Remove once it supports TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
